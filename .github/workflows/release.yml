name: Build and Release

on:
  push:
    branches: [release]
    tags: ['v*']
  # Store公開後に release-after-store.yml がタグ指定で実行する。手動でも同じ条件(タグ指定)で実行できる。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    concurrency:
      group: ditovr-${{ github.ref_type == 'tag' && 'stable-release' || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release version
        id: release-version
        run: |
          node scripts/release-manifest.mjs --validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content -Raw -Encoding UTF8 'desktop/Cargo.toml') -notmatch '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"') { throw 'Could not read the desktop version.' }
          $appVersion = $Matches[1]
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$appVersion" -Encoding utf8
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and !(Test-Path -LiteralPath "docs/release-notes/$($env:GITHUB_REF_NAME).md" -PathType Leaf)) {
            throw 'Write the changes since the previous release in docs/release-notes before publishing.'
          }
      - name: Plan release assets and updater migration
        id: distribution
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-update-feed.mjs --plan
      - name: Audit stable release dependencies
        if: github.ref_type == 'tag'
        run: ./scripts/audit-release-dependencies.ps1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Regression tests
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/Cargo.toml --locked --features microsoft-store
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path tools/sign-update/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/release-manifest.test.mjs scripts/publish-update-feed.test.mjs scripts/store-manifest.test.mjs scripts/publish-store.test.mjs scripts/store-release-ready.test.mjs scripts/check-store-connection.test.mjs
      - name: Build release with updater signatures
        if: github.ref_type == 'tag'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Set the TAURI_SIGNING_PRIVATE_KEY repository secret before publishing.'
          }
          ./scripts/build-installer.ps1 -Sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-manifest.mjs
      - name: Build branch preview without update publication
        if: github.ref_type != 'tag'
        run: |
          ./scripts/build-installer.ps1
      - name: Verify uninstall data cleanup
        run: |
          ./scripts/test-installer-hooks.ps1
      - name: Scan stable release files with Microsoft Defender
        if: github.ref_type == 'tag'
        run: |
          Update-MpSignature -ErrorAction Stop
          ./scripts/check-release-security.ps1 -Files @(
            'target/desktop/release/DiToVR.exe',
            'target/installer/DiToVR_${{ steps.release-version.outputs.version }}_x64-setup.exe'
          ) -ReportPath (Join-Path $env:RUNNER_TEMP 'ditovr-security.json')
      - name: Save release security report
        if: always() && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ditovr-security
          path: ${{ runner.temp }}/ditovr-security.json
          if-no-files-found: warn
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ditovr-windows
          path: |
            target/installer/DiToVR_${{ steps.release-version.outputs.version }}_x64-setup.exe
            target/installer/DiToVR_${{ steps.release-version.outputs.version }}_x64-setup.exe.sig
            latest.json
      # タグのpushでは検証とビルドだけ行う。公開は Microsoft Store の正式公開後に、
      # release-after-store.yml がこのワークフローをタグ指定で起動したときだけ行う。
      - name: Publish stable GitHub release
        if: github.ref_type == 'tag' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.distribution.outputs.release_files }}
          fail_on_unmatched_files: true
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          make_latest: true
      - name: Publish update feed outside release assets
        if: github.ref_type == 'tag' && github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-update-feed.mjs --publish
