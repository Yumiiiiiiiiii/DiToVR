name: Microsoft Store

on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      task:
        description: Build, check the connection, or retry an existing release tag
        type: choice
        options: [build, check-connection, retry-submission]
        default: build
      release_tag:
        description: Existing version tag to retry (retry-submission only, for example v0.2.2)
        type: string
        required: false

permissions:
  contents: read

jobs:
  connection:
    name: Verify Store connection (read only)
    if: github.repository == 'Yumiiiiiiiiii/DiToVR' && ((github.event_name == 'push' && github.ref_type == 'tag' && vars.MICROSOFT_STORE_PUBLISH_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.task == 'check-connection' || (inputs.task == 'retry-submission' && vars.MICROSOFT_STORE_PUBLISH_ENABLED == 'true'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check authentication and published product without submitting
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: node scripts/check-store-connection.mjs
  store:
    needs: connection
    if: always() && !cancelled() && github.repository == 'Yumiiiiiiiiii/DiToVR' && (needs.connection.result == 'success' || needs.connection.result == 'skipped') && (github.event_name != 'workflow_dispatch' || (inputs.task != 'check-connection' && (inputs.task != 'retry-submission' || vars.MICROSOFT_STORE_PUBLISH_ENABLED == 'true')))
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: ditovr-microsoft-store
      cancel-in-progress: false
    steps:
      - name: Validate retry tag input
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'retry-submission'
        env:
          STORE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:STORE_RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'retry-submission requires an existing vX.Y.Z release tag.'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'retry-submission' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Check out the fixed submission runner for retries
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'retry-submission'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: target/store-automation
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Validate Store version and release notes
        env:
          MICROSOFT_STORE_PUBLISH_ENABLED: ${{ vars.MICROSOFT_STORE_PUBLISH_ENABLED }}
          STORE_SUBMISSION_TASK: ${{ inputs.task }}
          STORE_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:STORE_SUBMISSION_TASK -eq 'retry-submission') {
            node target/store-automation/scripts/publish-store.mjs --validate-release
            exit $LASTEXITCODE
          }
          node scripts/release-manifest.mjs --validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and !(Test-Path -LiteralPath "docs/release-notes/$($env:GITHUB_REF_NAME).md" -PathType Leaf)) {
            throw 'Write the changes since the previous release in docs/release-notes before submitting.'
          }
      - name: Audit tagged Store dependencies
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.task == 'retry-submission')
        run: ./scripts/audit-release-dependencies.ps1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/store-build
          key: ${{ runner.os }}-store-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-store-cargo-
      - name: Store regression tests
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/store-build
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/release-manifest.test.mjs scripts/publish-update-feed.test.mjs scripts/store-manifest.test.mjs scripts/publish-store.test.mjs scripts/check-store-connection.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol,microsoft-store
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build MSIX and scan with Microsoft Defender
        id: build
        run: |
          Update-MpSignature -ErrorAction Stop
          ./scripts/build-store.ps1
      - name: Save Defender report
        if: always() && steps.build.outputs.security_report_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ditovr-store-security
          path: ${{ steps.build.outputs.security_report_path }}
          if-no-files-found: warn
      - name: Save Store package
        uses: actions/upload-artifact@v4
        with:
          name: ditovr-microsoft-store
          path: ${{ steps.build.outputs.package_path }}
          if-no-files-found: error
      - name: Submit release update to Microsoft Store
        if: vars.MICROSOFT_STORE_PUBLISH_ENABLED == 'true' && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.task == 'retry-submission'))
        env:
          MICROSOFT_STORE_PUBLISH_ENABLED: ${{ vars.MICROSOFT_STORE_PUBLISH_ENABLED }}
          STORE_SUBMISSION_TASK: ${{ inputs.task }}
          STORE_RELEASE_TAG: ${{ inputs.release_tag }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          STORE_PACKAGE_PATH: ${{ steps.build.outputs.package_path }}
          STORE_SECURITY_REPORT_PATH: ${{ steps.build.outputs.security_report_path }}
        run: |
          if ($env:STORE_SUBMISSION_TASK -eq 'retry-submission') {
            node target/store-automation/scripts/publish-store.mjs
          } else {
            node scripts/publish-store.mjs
          }
          exit $LASTEXITCODE
      - name: Explain build-only result
        if: vars.MICROSOFT_STORE_PUBLISH_ENABLED != 'true' || (github.ref_type != 'tag' && inputs.task != 'retry-submission')
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value 'Store MSIX built and scanned. No Store submission was made. Enabled version tag pushes and explicit retry-submission runs submit updates.'
