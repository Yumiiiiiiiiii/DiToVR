[package]
name = "ditovr-core"
version = "0.1.0"
edition = "2021"
description = "Discord notifications in VR (XSOverlay)"

[lib]
name = "ditovr_core"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "wav", "pcm"] }
vorbis_rs = { version = "0.5.6", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
